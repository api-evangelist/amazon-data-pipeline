id: https://api-evangelist.github.io/amazon-data-pipeline/capabilities/etl-pipeline-operations.yaml
name: ETL Pipeline Operations
description: Workflow-oriented Naftiko capability for ETL data processing operations using AWS Data Pipeline, covering pipeline creation, definition, activation, and monitoring workflows.
version: 1.0.0-alpha1
specificationVersion: 1.0.0-alpha1

tags:
  - ETL
  - Data Processing
  - Data Pipeline
  - Automation
  - Analytics

imports:
  - url: capabilities/shared/data-pipeline.yaml
    as: dataPipeline

personas:
  - name: Data Engineer
    description: Engineer building and maintaining data processing pipelines for ETL workflows
  - name: Data Analyst
    description: Analyst using pipelines to prepare data for analysis and reporting
  - name: Platform Engineer
    description: Engineer automating data movement between AWS storage and compute services

workflows:
  - name: Create and Activate Pipeline
    description: Create a new pipeline, define its activities and schedules, validate, and activate it
    steps:
      - step: createPipeline
        capability: dataPipeline
        description: Create an empty pipeline with name and unique ID
      - step: putPipelineDefinition
        capability: dataPipeline
        description: Define pipeline activities, schedules, and resources
      - step: validatePipelineDefinition
        capability: dataPipeline
        description: Validate the definition before activation
      - step: activatePipeline
        capability: dataPipeline
        description: Activate the pipeline to start processing
    persona: Data Engineer

  - name: Monitor Pipeline Execution
    description: Monitor the status and progress of a running pipeline
    steps:
      - step: queryObjects
        capability: dataPipeline
        description: Query pipeline instances by execution status
      - step: describeObjects
        capability: dataPipeline
        description: Get detailed status of specific pipeline objects
    persona: Data Analyst

  - name: Update Pipeline Definition
    description: Update an existing pipeline definition with new activities or schedules
    steps:
      - step: deactivatePipeline
        capability: dataPipeline
        description: Pause the pipeline before making changes
      - step: putPipelineDefinition
        capability: dataPipeline
        description: Update the pipeline definition
      - step: validatePipelineDefinition
        capability: dataPipeline
        description: Validate the updated definition
      - step: activatePipeline
        capability: dataPipeline
        description: Reactivate the updated pipeline
    persona: Data Engineer

rest:
  port: 8080
  baseURL: https://datapipeline.amazonaws.com
  auth:
    type: aws-signature-v4
    service: datapipeline

mcp:
  port: 9090
  tools:
    - name: create_and_activate_pipeline
      description: Create, define, validate, and activate a data processing pipeline
      workflow: Create and Activate Pipeline
    - name: monitor_pipeline_execution
      description: Monitor the status and progress of running pipeline instances
      workflow: Monitor Pipeline Execution
    - name: update_pipeline_definition
      description: Update an active pipeline with a new definition
      workflow: Update Pipeline Definition
    - name: list_pipelines
      description: List all data pipelines
      operationId: listPipelines
