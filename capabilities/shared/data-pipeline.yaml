id: https://api-evangelist.github.io/amazon-data-pipeline/capabilities/shared/data-pipeline.yaml
name: AWS Data Pipeline API
description: Naftiko shared capability definition for AWS Data Pipeline API, providing programmatic access to create, configure, and manage data processing pipelines for moving and transforming data between AWS services.
version: 1.0.0-alpha1
specificationVersion: 1.0.0-alpha1

provider:
  name: Amazon Web Services
  url: https://aws.amazon.com

tags:
  - AWS
  - Data Pipeline
  - ETL
  - Data Processing

rest:
  port: 8100
  baseURL: https://datapipeline.amazonaws.com
  auth:
    type: aws-signature-v4
    service: datapipeline
  resources:
    - name: Pipelines
      description: Manage data pipelines
      operations:
        - operationId: createPipeline
          summary: Create Pipeline
          method: POST
          path: /?Action=CreatePipeline
        - operationId: deletePipeline
          summary: Delete Pipeline
          method: POST
          path: /?Action=DeletePipeline
        - operationId: describePipelines
          summary: Describe Pipelines
          method: POST
          path: /?Action=DescribePipelines
        - operationId: listPipelines
          summary: List Pipelines
          method: POST
          path: /?Action=ListPipelines
    - name: Pipeline Objects
      description: Manage pipeline definitions and objects
      operations:
        - operationId: putPipelineDefinition
          summary: Put Pipeline Definition
          method: POST
          path: /?Action=PutPipelineDefinition
        - operationId: getPipelineDefinition
          summary: Get Pipeline Definition
          method: POST
          path: /?Action=GetPipelineDefinition
        - operationId: validatePipelineDefinition
          summary: Validate Pipeline Definition
          method: POST
          path: /?Action=ValidatePipelineDefinition
        - operationId: describeObjects
          summary: Describe Objects
          method: POST
          path: /?Action=DescribeObjects
        - operationId: queryObjects
          summary: Query Objects
          method: POST
          path: /?Action=QueryObjects
    - name: Pipeline Runs
      description: Manage pipeline activation and execution
      operations:
        - operationId: activatePipeline
          summary: Activate Pipeline
          method: POST
          path: /?Action=ActivatePipeline
        - operationId: deactivatePipeline
          summary: Deactivate Pipeline
          method: POST
          path: /?Action=DeactivatePipeline

mcp:
  port: 9100
  tools:
    - name: create_pipeline
      description: Create a new AWS Data Pipeline
      operationId: createPipeline
    - name: list_pipelines
      description: List all data pipelines
      operationId: listPipelines
    - name: describe_pipelines
      description: Get details of specific pipelines
      operationId: describePipelines
    - name: put_pipeline_definition
      description: Set the pipeline definition with activities and schedules
      operationId: putPipelineDefinition
    - name: validate_pipeline_definition
      description: Validate a pipeline definition before activating
      operationId: validatePipelineDefinition
    - name: activate_pipeline
      description: Activate a pipeline to start processing
      operationId: activatePipeline
    - name: deactivate_pipeline
      description: Deactivate a running pipeline
      operationId: deactivatePipeline
    - name: query_pipeline_objects
      description: Query pipeline objects by status or other criteria
      operationId: queryObjects
